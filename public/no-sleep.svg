<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Modern gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#bgGradient)" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  
  <!-- Sun/Awake symbol -->
  <circle cx="50" cy="50" r="18" fill="url(#sunGradient)"/>
  
  <!-- Sun rays -->
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
    <!-- Top rays -->
    <line x1="50" y1="15" x2="50" y2="22"/>
    <line x1="71" y1="21" x2="66" y2="26"/>
    <line x1="85" y1="50" x2="78" y2="50"/>
    <line x1="79" y1="79" x2="74" y2="74"/>
    <!-- Bottom rays -->
    <line x1="50" y1="85" x2="50" y2="78"/>
    <line x1="21" y1="79" x2="26" y2="74"/>
    <line x1="15" y1="50" x2="22" y2="50"/>
    <line x1="29" y1="21" x2="34" y2="26"/>
  </g>
  
  <!-- Prohibition slash (NO SLEEP) -->
  <line x1="30" y1="30" x2="70" y2="70" stroke="#ef4444" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
</svg>